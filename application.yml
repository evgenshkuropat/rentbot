spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}

rentbot:
  sent-log:
    retention-days: ${RENTBOT_SENT_LOG_RETENTION_DAYS:90}
  notifications:
    max-per-user-per-cycle: ${RENTBOT_NOTIFICATIONS_MAX_PER_USER_PER_CYCLE:5}
  bazos:
    max-requests-per-cycle: ${RENTBOT_BAZOS_MAX_REQUESTS_PER_CYCLE:30}
    request-delay-ms: ${RENTBOT_BAZOS_REQUEST_DELAY_MS:500}
    rate-limit-cooldown-ms: ${RENTBOT_BAZOS_RATE_LIMIT_COOLDOWN_MS:900000}
  digireality:
    enabled: ${RENTBOT_DIGIREALITY_ENABLED:true}
    cache-ttl-ms: ${RENTBOT_DIGIREALITY_CACHE_TTL_MS:600000}
  reactivation:
    inactive:
      auto-enabled: ${RENTBOT_REACTIVATION_INACTIVE_AUTO_ENABLED:false}
      auto-batch-size: ${RENTBOT_REACTIVATION_INACTIVE_AUTO_BATCH_SIZE:50}
      auto-cron: ${RENTBOT_REACTIVATION_INACTIVE_AUTO_CRON:0 30 19 * * *}
      time-zone: ${RENTBOT_REACTIVATION_INACTIVE_TIME_ZONE:Europe/Prague}
  search-status:
    auto-enabled: ${RENTBOT_SEARCH_STATUS_AUTO_ENABLED:false}
    auto-batch-size: ${RENTBOT_SEARCH_STATUS_AUTO_BATCH_SIZE:100}
    auto-cron: ${RENTBOT_SEARCH_STATUS_AUTO_CRON:0 45 18 * * *}
    time-zone: ${RENTBOT_SEARCH_STATUS_TIME_ZONE:Europe/Prague}
  premium:
    expiry-reminder:
      auto-enabled: ${RENTBOT_PREMIUM_EXPIRY_REMINDER_AUTO_ENABLED:true}
      auto-cron: ${RENTBOT_PREMIUM_EXPIRY_REMINDER_AUTO_CRON:0 0 11 * * *}
      time-zone: ${RENTBOT_PREMIUM_EXPIRY_REMINDER_TIME_ZONE:Europe/Prague}
    second-search-reminder:
      auto-enabled: ${RENTBOT_PREMIUM_SECOND_SEARCH_REMINDER_AUTO_ENABLED:true}
      auto-cron: ${RENTBOT_PREMIUM_SECOND_SEARCH_REMINDER_AUTO_CRON:0 0 12 * * *}
      time-zone: ${RENTBOT_PREMIUM_SECOND_SEARCH_REMINDER_TIME_ZONE:Europe/Prague}
  health:
    check-delay-ms: ${RENTBOT_HEALTH_CHECK_DELAY_MS:300000}
    initial-delay-ms: ${RENTBOT_HEALTH_INITIAL_DELAY_MS:300000}
    stalled-after-minutes: ${RENTBOT_HEALTH_STALLED_AFTER_MINUTES:40}
    max-cycle-duration-minutes: ${RENTBOT_HEALTH_MAX_CYCLE_DURATION_MINUTES:60}
